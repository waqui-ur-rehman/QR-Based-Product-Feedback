<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Product Feedback</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Product Feedback</h1>
        <div class="product">
            <div class="product-image">
                <div></div>
            </div>
            <h2>ABC Chips</h2>
            <p class="description">

                Crispy and delicious potato chips.
                Share your experience and help us improve our product.

            </p>
            <p>
                <b>Category:</b> Snacks
            </p>
            <p>
                <b>Price:</b> Rs. 100
            </p>
            <div class="rating">
                ⭐⭐⭐⭐☆ <span>4.0 / 5</span>
            </div>
        </div>
        <div class="reviews">
            <h2>Customer Reviews</h2>
        </div>
        <div class="feedback">
            <h2>Give Your Review</h2>
            <input
                type="text"
                id="name"
                placeholder="Your Name"
            >
            <select id="rating">
                <option value="5">⭐⭐⭐⭐⭐  </option>
                <option value="4">⭐⭐⭐⭐  </option>
                <option value="3">⭐⭐⭐  </option>
                <option value="2">⭐⭐  </option>
                <option value="1">⭐  </option>
            </select>
            <textarea
                id="review"
                placeholder="Write your review"
            ></textarea>
            <button id="submitBtn">
                Submit Review
            </button>
        </div>
    </div>
    <script src="script.js"></script>

</body>

</html>
